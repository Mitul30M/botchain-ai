[project]
name = "botchain-ai"
version = "0.1.0"
description = "BotChain AI — FastAPI backend that turns plain-language business processes into validated n8n workflows"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "deepagents>=0.6.12",
    "fastapi>=0.115.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.3.0",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
