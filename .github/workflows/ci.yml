name: CI

# Runs on every PR, and on pushes to main so the branch a deploy ships from is
# always verified. The `deploy` job below gates on these three.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.25"

# Action refs are pinned to exact versions, and `astral-sh/setup-uv` specifically to a
# full semver tag. Its v10 line has no floating `v10` major tag yet (v7 does: `v7.6`), so
# `uses: ...@v10` fails at runtime with "unable to find version 'v10'". That is not
# something actionlint can catch — it does not resolve refs over the network — so it only
# surfaced on the first real CI run. Check a ref with:
#   curl -fsS -o /dev/null -w '%{http_code}\n' \
#     https://api.github.com/repos/<owner>/<repo>/git/ref/tags/<ref>   # want 200

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests

  test:
    name: Test (pytest, no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      # `-m "not db"` is deliberate and load-bearing. tests/test_checkpoint.py is
      # the only suite that touches a real database and it reads DATABASE_URL, which
      # resolves to the PRODUCTION Neon branch. Wiring that URL into CI secrets
      # would make every PR write to production, so CI runs no database at all and
      # stays secret-free. The dedicated `tests` Neon branch is deferred (Phase 8);
      # when it lands, switch this to a second job that runs `-m db` against it.
      - name: Run test suite
        run: uv run pytest -m "not db" -v

  docker:
    name: Image (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: botchain-ai:ci
          # ubuntu runners are amd64, so this also proves the Railway target arch
          # builds — locally we only exercise arm64.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # WS9.5. Kept in this file rather than a separate deploy.yml on purpose: `needs`
  # can only reference jobs in the SAME workflow, so a separate file could not
  # actually gate on CI being green — the real guard this phase asks for.
  deploy:
    name: Deploy (Railway)
    needs: [lint, test, docker]
    # Inert until Phase 10: flip the RAILWAY_DEPLOY_ENABLED repository variable to
    # "true". Both conditions keep it off PRs and off main until then. A skipped
    # job does not fail the run, so this costs nothing while disabled.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # GitHub Environment. Add required reviewers in repo settings so a production
    # deploy needs a human click, and scope RAILWAY_TOKEN here so it is never
    # exposed to pull-request runs.
    environment: production
    steps:
      - uses: actions/checkout@v7
      # Railway's CLI is installed on the runner rather than run via
      # `container: ghcr.io/railwayapp/cli:latest`, because that image is
      # Alpine-based (no bash, so `run:` steps fail) and `railway up` needs the
      # source tree present in the workspace to upload.
      # Trade-off: this executes a remote install script. If that becomes a
      # concern, pin a release binary from the railwayapp/cli releases instead.
      - name: Install Railway CLI
        run: bash <(curl -fsSL https://railway.com/install.sh) -y
      - name: Deploy
        # `--ci` exits when the Railway build completes, so a failed remote build
        # fails this job instead of reporting a green deploy. `--project` requires
        # `--environment`. `--service` picks the backend service explicitly.
        run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment production
          --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}